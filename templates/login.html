{% extends "base.html" %}


{% block content %}

{% if errors %}
    {% for error in errors %}
        <p class="errors">{{ error }}</p>
    {% endfor %}
{% endif %}

<form method="POST">
    <br />
    <input
    type="text"
    name="username"
    placeholder="Create a username"
    /><br />

    <input
    type="text"
    name="password"
    placeholder="Create a password"
    /><br /> <br />

    <button type="submit">Log In</button>
</form>


{% endblock %}
